<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Lab — Dashboard</title>
<style>
:root{--bg:#f4f1e9;--panel:#fffdf8;--ink:#151515;--muted:#77736b;--line:#d9d3c7;--accent:#ff4d00;--dark:#171717}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:var(--dark);color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 30px;border-bottom:1px solid #343434}.brand img{width:38px;height:38px;object-fit:contain}.brand b{font-size:15px;letter-spacing:.08em}.brand small{display:block;color:#aaa;margin-top:3px}.nav{padding-top:24px}.nav button{width:100%;text-align:left;background:none;border:0;color:#bcbcbc;padding:13px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px}.nav button.active,.nav button:hover{background:#292929;color:#fff}.nav button.active{border-left:2px solid var(--accent)}
.main{padding:28px 34px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--panel);padding:11px 15px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:12px}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:30px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{font-size:18px;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:7px 9px;cursor:pointer}.iconbtn:hover{border-color:var(--accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{border:1px solid var(--line);background:#fff;padding:11px;border-radius:8px}.field textarea{min-height:110px;resize:vertical}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:15px}.brand{border:0;padding-bottom:10px}.nav{display:flex;overflow:auto;padding:4px 0}.nav button{min-width:max-content;margin-right:5px}.main{padding:22px 16px}.stats{grid-template-columns:1fr 1fr}.table{min-width:760px}.panel{overflow:auto}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="assets/logo-header.png"><div><b>CASE LAB</b><small>Admin Dashboard</small></div></div><nav class="nav"><button class="active" data-page="overview">Overview</button><button data-page="cases">Cases</button><button data-page="sections">Sections & Layout</button><button data-page="tools">Tools</button><button data-page="settings">Settings</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Overview</h1><p id="sub">Manage your Case Lab content.</p></div><div class="top-actions"><button class="btn" id="theme">Dark Mode</button><button class="btn primary" id="newCase">+ New Case</button></div></div><div id="content"></div></main></div>
<script>
const KEY='case-lab-cases',SEED=[{"slug": "revenue-under-pressure", "title_en": "Revenue Under Pressure", "title_ar": "الإيرادات تحت الضغط", "summary_en": "Diagnose a revenue slowdown, identify the key drivers, and build a management-ready view.", "summary_ar": "حلل تباطؤ الإيرادات وحدد المحركات الرئيسية وابنِ رؤية مناسبة للإدارة.", "category_en": "Revenue Analysis", "category_ar": "تحليل الإيرادات", "difficulty_en": "Intermediate", "difficulty_ar": "متوسط", "tags": ["Revenue", "Drivers", "Analysis", "FP&A"], "published": true}, {"slug": "profitability-deep-dive", "title_en": "Profitability Deep Dive", "title_ar": "تحليل الربحية بعمق", "summary_en": "Sales are growing, but profit is not. Find the real margin drivers.", "summary_ar": "المبيعات تنمو لكن الأرباح لا تتحرك بنفس الشكل. اكتشف الأسباب.", "category_en": "Profitability", "category_ar": "الربحية", "difficulty_en": "Intermediate", "difficulty_ar": "متوسط", "tags": ["Margins", "Profitability", "Excel"], "published": true}, {"slug": "build-the-fpa-plan", "title_en": "Build the FP&A Plan", "title_ar": "ابنِ خطة FP&A", "summary_en": "Build a planning view from assumptions, budgets and forecasts.", "summary_ar": "ابنِ رؤية تخطيطية من الافتراضات والميزانية والتوقعات.", "category_en": "FP&A", "category_ar": "التخطيط المالي", "difficulty_en": "Advanced", "difficulty_ar": "متقدم", "tags": ["FP&A", "Budget", "Forecast"], "published": true}, {"slug": "variance-analysis", "title_en": "The Variance Story", "title_ar": "قصة الانحرافات", "summary_en": "Turn actual-vs-budget variance into a management-ready analysis.", "summary_ar": "حوّل انحرافات الفعلي مقابل الموازنة إلى تحليل مناسب للإدارة.", "category_en": "Management Reporting", "category_ar": "تقارير الإدارة", "difficulty_en": "Beginner", "difficulty_ar": "مبتدئ", "tags": ["Variance", "Reporting", "Budget"], "published": true}, {"slug": "forecast-reset", "title_en": "Reset the Forecast", "title_ar": "أعد بناء التوقعات", "summary_en": "Rebuild the forecast, challenge assumptions and explain the gap.", "summary_ar": "أعد بناء التوقعات واختبر الافتراضات واشرح الفجوة.", "category_en": "Forecasting", "category_ar": "التنبؤ المالي", "difficulty_en": "Advanced", "difficulty_ar": "متقدم", "tags": ["Forecast", "Scenario", "FP&A"]}, {"slug": "business-performance-review", "title_en": "Business Performance Review", "title_ar": "مراجعة أداء الأعمال", "summary_en": "Create an analyst-style performance review from business data.", "summary_ar": "أنشئ مراجعة أداء بأسلوب المحلل المالي من بيانات الأعمال.", "category_en": "Business Performance", "category_ar": "أداء الأعمال", "difficulty_en": "Intermediate", "difficulty_ar": "متوسط", "tags": ["KPIs", "Performance", "Analysis"], "published": true}];
function getCases(){try{return JSON.parse(localStorage.getItem(KEY))||SEED}catch(e){return SEED}}
function saveCases(x){localStorage.setItem(KEY,JSON.stringify(x))}
function overview(){let c=getCases();content.innerHTML='<div class="stats"><div class="stat"><span>Total Cases</span><strong>'+c.length+'</strong></div><div class="stat"><span>Published</span><strong>'+c.filter(x=>x.published!==false).length+'</strong></div><div class="stat"><span>Hidden</span><strong>'+c.filter(x=>x.published===false).length+'</strong></div><div class="stat"><span>Categories</span><strong>'+new Set(c.map(x=>x.category_en)).size+'</strong></div></div><div class="panel"><div class="panel-head"><h2>Case Library</h2><button class="btn primary" onclick="editCase()">+ New Case</button></div><table class="table"><thead><tr><th>Case</th><th>Category</th><th>Level</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+c.map((x,i)=>'<tr><td><b>'+x.title_en+'</b></td><td>'+x.category_en+'</td><td>'+x.difficulty_en+'</td><td>'+(x.published===false?'Hidden':'Published')+'</td><td><div class="actions"><button class="iconbtn" onclick="editCase('+i+')">Edit</button><button class="iconbtn" onclick="toggleCase('+i+')">'+(x.published===false?'Publish':'Hide')+'</button><button class="iconbtn" onclick="deleteCase('+i+')">Delete</button></div></td></tr>').join('')+'</tbody></table></div>'}
function editCase(i){let c=getCases(),x=i==null?{}:c[i];content.innerHTML='<div class="panel"><div class="panel-head"><h2>'+(i==null?'New Case':'Edit Case')+'</h2><button class="btn" onclick="overview()">Back</button></div><form class="form" onsubmit="event.preventDefault();saveCase('+(i==null?-1:i)+')"><div class="field"><label>Title EN</label><input id="e1" required value="'+(x.title_en||'')+'"></div><div class="field"><label>Title AR</label><input id="e2" value="'+(x.title_ar||'')+'"></div><div class="field"><label>Category EN</label><input id="e3" value="'+(x.category_en||'')+'"></div><div class="field"><label>Category AR</label><input id="e4" value="'+(x.category_ar||'')+'"></div><div class="field"><label>Difficulty EN</label><select id="e5"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label>Difficulty AR</label><input id="e6" value="'+(x.difficulty_ar||'')+'"></div><div class="field full"><label>Summary EN</label><textarea id="e7">'+(x.summary_en||'')+'</textarea></div><div class="field full"><label>Summary AR</label><textarea id="e8">'+(x.summary_ar||'')+'</textarea></div><div class="field full"><label>Slug</label><input id="e9" required value="'+(x.slug||'')+'"></div><div class="field full"><label><input id="e10" type="checkbox" '+(x.published!==false?'checked':'')+'> Published</label></div><div class="field full"><button class="btn primary">Save Case</button></div></form></div>';if(x.difficulty_en)e5.value=x.difficulty_en}
function saveCase(i){let c=getCases(),x={slug:e9.value,title_en:e1.value,title_ar:e2.value,category_en:e3.value,category_ar:e4.value,difficulty_en:e5.value,difficulty_ar:e6.value,summary_en:e7.value,summary_ar:e8.value,tags:(i>=0&&c[i].tags)||['Analysis','Business Case'],published:e10.checked};if(i<0)c.push(x);else c[i]=x;saveCases(c);overview()}
function toggleCase(i){let c=getCases();c[i].published=c[i].published===false;saveCases(c);overview()}function deleteCase(i){if(confirm('Delete this case permanently?')){let c=getCases();c.splice(i,1);saveCases(c);overview()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=b.textContent;overview()});
newCase.onclick=()=>editCase();theme.onclick=()=>document.body.classList.toggle('dark');overview();
</script></body></html>
