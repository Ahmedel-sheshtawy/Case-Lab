<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Lab — Dashboard</title>
<style>
:root{--bg:#f4f1e9;--panel:#fffdf8;--ink:#151515;--muted:#77736b;--line:#d9d3c7;--accent:#ff4d00;--dark:#171717}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:var(--dark);color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 30px;border-bottom:1px solid #343434}.brand img{width:38px;height:38px;object-fit:contain}.brand b{font-size:15px;letter-spacing:.08em}.brand small{display:block;color:#aaa;margin-top:3px}.nav{padding-top:24px}.nav button{width:100%;text-align:left;background:none;border:0;color:#bcbcbc;padding:13px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px}.nav button.active,.nav button:hover{background:#292929;color:#fff}.nav button.active{border-left:2px solid var(--accent)}
.main{padding:28px 34px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--panel);padding:11px 15px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:12px}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:30px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{font-size:18px;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:7px 9px;cursor:pointer}.iconbtn:hover{border-color:var(--accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{border:1px solid var(--line);background:#fff;padding:11px;border-radius:8px}.field textarea{min-height:110px;resize:vertical}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:15px}.brand{border:0;padding-bottom:10px}.nav{display:flex;overflow:auto;padding:4px 0}.nav button{min-width:max-content;margin-right:5px}.main{padding:22px 16px}.stats{grid-template-columns:1fr 1fr}.table{min-width:760px}.panel{overflow:auto}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}

.login-screen{position:fixed;inset:0;background:#171717;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.login-card{width:min(420px,100%);background:#fffdf8;color:#151515;border:1px solid #343434;border-radius:16px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.login-card img{width:48px;height:48px;object-fit:contain;margin-bottom:18px}.login-card h1{margin:0 0 7px;font-size:25px}.login-card p{color:#77736b;margin:0 0 22px}.login-card .field{margin-bottom:14px}.login-card input{width:100%;border:1px solid #d9d3c7;background:#fff;padding:12px;border-radius:8px}.login-card button{width:100%;margin-top:8px}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:10px}.hidden{display:none!important}.form .section-label{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;margin-top:6px;font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.form textarea{min-height:130px}.hint{font-size:12px;color:var(--muted)}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="assets/logo-header.png"><div><b>CASE LAB</b><small>Admin Dashboard</small></div></div><nav class="nav"><button class="active" data-page="overview">Overview</button><button data-page="cases">Cases</button><button data-page="sections">Sections & Layout</button><button data-page="tools">Tools</button><button data-page="settings">Settings</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Overview</h1><p id="sub">Manage your Case Lab content.</p></div><div class="top-actions"><button class="btn" id="theme">Dark Mode</button><button class="btn primary" id="newCase">+ New Case</button></div></div><div id="content"></div></main></div>
<div class="login-screen" id="loginScreen"><div class="login-card"><img src="assets/logo-header.png" alt="Case Lab"><h1>Case Lab Dashboard</h1><p>Sign in to manage your cases.</p><form id="loginForm"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign In</button><div class="error" id="loginError"></div></form></div></div>
<script>
const content=document.getElementById('content');
let CASES=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed');return d}
async function boot(){try{const me=await api('/api/me');if(!me.ok)throw 0;$('loginScreen').classList.add('hidden');await overview();}catch(e){$('loginScreen').classList.remove('hidden');}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginScreen').classList.add('hidden');await overview();}catch(err){$('loginError').textContent=err.message}});
async function load(){const d=await api('/api/cases?admin=1');CASES=d.cases||[];return CASES}
function tagsText(v){return Array.isArray(v)?v.join(', '):String(v||'')}
function filesText(v){return Array.isArray(v)?v.join('
'):String(v||'')}
function overview(){return load().then(c=>{content.innerHTML='<div class="stats"><div class="stat"><span>Total Cases</span><strong>'+c.length+'</strong></div><div class="stat"><span>Published</span><strong>'+c.filter(x=>x.published).length+'</strong></div><div class="stat"><span>Hidden</span><strong>'+c.filter(x=>!x.published).length+'</strong></div><div class="stat"><span>Categories</span><strong>'+new Set(c.map(x=>x.category_en).filter(Boolean)).size+'</strong></div></div><div class="panel"><div class="panel-head"><h2>Case Library</h2><button class="btn primary" onclick="editCase()">+ New Case</button></div><table class="table"><thead><tr><th>Case</th><th>Category</th><th>Level</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+c.map(x=>'<tr><td><b>'+esc(x.title_en)+'</b></td><td>'+esc(x.category_en)+'</td><td>'+esc(x.difficulty_en)+'</td><td>'+(x.published?'Published':'Hidden')+'</td><td><div class="actions"><button class="iconbtn" onclick="editCase('+x.id+')">Edit</button><button class="iconbtn" onclick="toggleCase('+x.id+','+(!x.published)+')">'+(x.published?'Hide':'Publish')+'</button><button class="iconbtn" onclick="deleteCase('+x.id+')">Delete</button></div></td></tr>').join('')+'</tbody></table></div>'})}
function field(label,id,value,full=false,placeholder=''){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input id="'+id+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'"></div>'}
function area(label,id,value,full=true){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><textarea id="'+id+'">'+esc(value)+'</textarea></div>'}
function editCase(id){const x=id?CASES.find(c=>Number(c.id)===Number(id))||{}:{};content.innerHTML='<div class="panel"><div class="panel-head"><h2>'+(id?'Edit Case':'New Case')+'</h2><button class="btn" onclick="overview()">Back</button></div><form class="form" id="caseForm">'+field('Title EN','title_en',x.title_en)+field('Title AR','title_ar',x.title_ar)+field('Category EN','category_en',x.category_en)+field('Category AR','category_ar',x.category_ar)+field('Difficulty EN','difficulty_en',x.difficulty_en||'Intermediate')+field('Difficulty AR','difficulty_ar',x.difficulty_ar||'متوسط')+area('Summary EN','summary_en',x.summary_en)+area('Summary AR','summary_ar',x.summary_ar)+field('Slug','slug',x.slug,'full','revenue-under-pressure')+field('Tags (comma separated)','tags',tagsText(x.tags),'full','Revenue, FP&A, Analysis')+'<div class="field full"><label>Files (one URL per line)</label><textarea id="files" placeholder="https://example.com/file.xlsx
https://example.com/data.pdf">'+esc(filesText(x.files))+'</textarea><span class="hint">Use direct file URLs. No file is uploaded by this form.</span></div><div class="section-label">Case Content</div>'+area('Business Scenario EN','scenario_en',x.scenario_en)+area('Business Scenario AR','scenario_ar',x.scenario_ar)+area('Your Mission EN','mission_en',x.mission_en)+area('Your Mission AR','mission_ar',x.mission_ar)+area('Data Provided EN','data_en',x.data_en)+area('Data Provided AR','data_ar',x.data_ar)+area('Hints EN','hints_en',x.hints_en)+area('Hints AR','hints_ar',x.hints_ar)+area('Solution EN','solution_en',x.solution_en)+area('Solution AR','solution_ar',x.solution_ar)+'<div class="field"><label>Sort Order</label><input id="sort_order" type="number" value="'+esc(x.sort_order||0)+'"></div><div class="field"><label>Publication</label><select id="published"><option value="1" '+(x.published!==false?'selected':'')+'>Published</option><option value="0" '+(x.published===false?'selected':'')+'>Hidden</option></select></div><div class="field full"><button class="btn primary" type="submit">Save Case</button></div></form></div>';$('caseForm').addEventListener('submit',async e=>{e.preventDefault();const payload={};['title_en','title_ar','category_en','category_ar','difficulty_en','difficulty_ar','summary_en','summary_ar','slug','scenario_en','scenario_ar','mission_en','mission_ar','data_en','data_ar','hints_en','hints_ar','solution_en','solution_ar'].forEach(k=>payload[k]=$(k).value);payload.tags=$('tags').value;payload.files=$('files').value.split(/
+/).map(s=>s.trim()).filter(Boolean);payload.sort_order=Number($('sort_order').value||0);payload.published=$('published').value==='1';try{await api(id?'/api/cases/'+id:'/api/cases',{method:id?'PUT':'POST',body:JSON.stringify(payload)});await overview()}catch(err){alert(err.message)}})}
async function toggleCase(id,published){try{const x=CASES.find(c=>Number(c.id)===Number(id));if(!x)return;const payload={...x,published,tags:x.tags,files:x.files};delete payload.id;delete payload.created_at;delete payload.updated_at;await api('/api/cases/'+id,{method:'PUT',body:JSON.stringify(payload)});await overview()}catch(e){alert(e.message)}}
async function deleteCase(id){if(!confirm('Delete this case permanently?'))return;try{await api('/api/cases/'+id,{method:'DELETE'});await overview()}catch(e){alert(e.message)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('title').textContent=b.textContent;if(b.dataset.page==='cases'||b.dataset.page==='overview')overview();else content.innerHTML='<div class="panel"><h2>'+esc(b.textContent)+'</h2><p>Section ready for future Case Lab settings.</p></div>'});$('newCase').onclick=()=>editCase();$('theme').onclick=()=>document.body.classList.toggle('dark');
boot();
</script></body></html>
