<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Lab — Admin</title>
<style>
:root{--bg:#f3f0e8;--panel:#fffdf8;--ink:#171717;--muted:#77736b;--line:#d8d1c4;--accent:#ff4d00;--dark:#151515;--dark2:#202020;--danger:#b42318;--ok:#18794e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:var(--dark);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 24px;border-bottom:1px solid #343434}.brand img{width:40px;height:40px;object-fit:contain}.brand b{font-size:15px;letter-spacing:.1em}.brand small{display:block;color:#999;margin-top:3px}.nav{padding-top:20px;display:grid;gap:5px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#bdbdbd;padding:12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#292929;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.side-bottom{margin-top:auto;display:grid;gap:8px}.logout{border:1px solid #3b3b3b;background:#202020;color:#ddd;padding:11px 12px;border-radius:9px;cursor:pointer}.logout:hover{border-color:#666}
.main{padding:28px 34px 60px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:9px;cursor:pointer}.btn:hover{border-color:#aaa}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:12px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:29px;margin-top:8px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:21px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h2{font-size:18px;margin:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.actions{display:flex;gap:6px;flex-wrap:wrap}.iconbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:7px 9px;cursor:pointer}.iconbtn:hover{border-color:var(--accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;padding:11px;border-radius:8px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9d9588;box-shadow:0 0 0 3px rgba(255,77,0,.08)}.field textarea{min-height:125px;resize:vertical}.section-label{grid-column:1/-1;border-top:1px solid var(--line);padding-top:19px;margin-top:5px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.hint{font-size:12px;color:var(--muted);line-height:1.5}.savebar{display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:14px;margin-top:8px}.files-box{border:1px solid var(--line);border-radius:10px;background:#faf8f2;padding:12px}.file-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}.file-row:last-child{margin-bottom:0}.file-row input{border:1px solid var(--line);background:#fff;padding:10px;border-radius:8px}.file-remove{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;cursor:pointer}.empty{padding:35px 15px;text-align:center;color:var(--muted)}
.login-screen{position:fixed;inset:0;background:#151515;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}.login-card{width:min(420px,100%);background:#fffdf8;color:#171717;border-radius:16px;padding:28px;border:1px solid #333;box-shadow:0 30px 90px rgba(0,0,0,.4)}.login-card img{width:48px;height:48px;object-fit:contain;margin-bottom:15px}.login-card h1{margin:0 0 6px}.login-card p{margin:0 0 22px;color:var(--muted)}.login-card .field{margin-bottom:13px}.login-card input{width:100%;border:1px solid var(--line);padding:12px;border-radius:8px}.login-card .btn{width:100%}.error{min-height:18px;color:var(--danger);font-size:13px;margin-top:9px}
.toast{position:fixed;right:20px;bottom:20px;background:#171717;color:#fff;padding:11px 14px;border-radius:9px;z-index:1200;box-shadow:0 12px 30px rgba(0,0,0,.2)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:14px}.brand{padding-bottom:12px;border:0}.nav{display:flex;overflow:auto;padding:4px 0}.nav button{min-width:max-content}.side-bottom{display:block;margin-top:8px}.logout{width:100%}.main{padding:22px 15px}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}.form{grid-template-columns:1fr}.field.full,.section-label{grid-column:auto}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.file-row{grid-template-columns:1fr}.file-remove{padding:9px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><img src="/assets/logo-header.png" alt="Case Lab"><div><b>CASE LAB</b><small>Admin Dashboard</small></div></div>
  <nav class="nav">
    <button class="active" data-page="overview">Overview</button>
    <button data-page="cases">Cases</button>
    <button data-page="sections">Sections & Layout</button>
    <button data-page="tools">Tools</button>
    <button data-page="settings">Settings</button>
  </nav>
  <div class="side-bottom"><button class="logout" id="logout">↪ Sign out</button></div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="title">Overview</h1><p id="sub">Manage your Case Lab content.</p></div><div class="top-actions"><button class="btn" id="theme">Light Mode</button><button class="btn primary" id="newCase">+ New Case</button></div></div>
  <div id="content"></div>
</main>
</div>
<div class="login-screen hidden" id="loginScreen"><div class="login-card"><img src="/assets/logo-header.png" alt="Case Lab"><h1>Case Lab Dashboard</h1><p>Sign in to manage your cases.</p><form id="loginForm"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign In</button><div class="error" id="loginError"></div></form></div></div>
<div class="toast hidden" id="toast"></div>
<script>
const $=id=>document.getElementById(id), content=$('content');
let CASES=[], editingId=null, dark=false;
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed');return d}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
async function boot(){try{const me=await api('/api/me');if(me.ok){$('loginScreen').classList.add('hidden');await overview()}else $('loginScreen').classList.remove('hidden')}catch(e){$('loginScreen').classList.remove('hidden')}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginScreen').classList.add('hidden');toast('Signed in');await overview()}catch(err){$('loginError').textContent=err.message}});
$('logout').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST'});CASES=[];$('loginUser').value='';$('loginPass').value='';$('loginScreen').classList.remove('hidden');toast('Signed out')}catch(e){toast(e.message)}});
async function load(){const d=await api('/api/cases?admin=1');CASES=d.cases||[];return CASES}
function tagsText(v){return Array.isArray(v)?v.join(', '):String(v||'')}
function filesArray(v){return Array.isArray(v)?v.filter(Boolean):[]}
function setPage(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(name==='overview')overview();else if(name==='cases')casesPage();else placeholder(name)}
function casesPage(){return load().then(c=>{ $('title').textContent='Cases';$('sub').textContent='Manage and edit every case published on Case Lab.';content.innerHTML='<div class="panel"><div class="panel-head"><h2>Case Library</h2><button class="btn primary" onclick="newCaseForm()">+ New Case</button></div>'+table(c)+'</div>'}).catch(e=>{content.innerHTML='<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'})}
function placeholder(name){const labels={sections:['Sections & Layout','Section controls will be connected here next.'],tools:['Tools','Your admin-only file and utility links will live here.'],settings:['Settings','Global Case Lab settings will live here.']};$('title').textContent=labels[name][0];$('sub').textContent=labels[name][1];content.innerHTML='<div class="panel"><div class="empty">'+esc(labels[name][1])+'</div></div>'}
function overview(){return load().then(c=>{ $('title').textContent='Overview';$('sub').textContent='Manage your Case Lab content.';content.innerHTML='<div class="stats"><div class="stat"><span>Total Cases</span><strong>'+c.length+'</strong></div><div class="stat"><span>Published</span><strong>'+c.filter(x=>x.published).length+'</strong></div><div class="stat"><span>Hidden</span><strong>'+c.filter(x=>!x.published).length+'</strong></div><div class="stat"><span>Categories</span><strong>'+new Set(c.map(x=>x.category_en).filter(Boolean)).size+'</strong></div></div><div class="panel"><div class="panel-head"><h2>Case Library</h2><button class="btn primary" onclick="newCaseForm()">+ New Case</button></div>'+table(c)+'</div>'}).catch(e=>{content.innerHTML='<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'})}
function table(c){if(!c.length)return '<div class="empty">No cases yet. Create your first case.</div>';return '<div class="table-wrap"><table class="table"><thead><tr><th>Case</th><th>Category</th><th>Level</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+c.map(x=>'<tr><td><b>'+esc(x.title_en)+'</b><br><span class="hint">'+esc(x.slug)+'</span></td><td>'+esc(x.category_en)+'</td><td>'+esc(x.difficulty_en)+'</td><td>'+ (x.published?'<span style="color:var(--ok)">Published</span>':'<span style="color:var(--muted)">Hidden</span>')+'</td><td><div class="actions"><button class="iconbtn" onclick="editCase('+x.id+')">Edit</button><button class="iconbtn" onclick="toggleCase('+x.id+','+(!x.published)+')">'+(x.published?'Hide':'Publish')+'</button><button class="iconbtn" onclick="deleteCase('+x.id+')">Delete</button></div></td></tr>').join('')+'</tbody></table></div>'}
function input(label,id,value,full=false,ph=''){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input id="'+id+'" value="'+esc(value)+'" placeholder="'+esc(ph)+'"></div>'}
function area(label,id,value,full=true,ph=''){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><textarea id="'+id+'" placeholder="'+esc(ph)+'">'+esc(value)+'</textarea></div>'}
function fileRows(files){files=filesArray(files);if(!files.length)files=[''];return '<div class="files-box" id="filesBox">'+files.map((u,i)=>'<div class="file-row"><input class="file-url" value="'+esc(u)+'" placeholder="https://files.example.com/data.xlsx"><button type="button" class="file-remove" onclick="this.parentElement.remove()">Remove</button></div>').join('')+'</div><button type="button" class="btn" style="margin-top:8px" onclick="addFileRow()">+ Add file</button><div class="hint" style="margin-top:7px">Add a direct URL to an Excel, PDF, PowerPoint, ZIP, image, or other case asset. The dashboard stores the link; it does not upload the file itself.</div>'}
function addFileRow(){const box=$('filesBox');const row=document.createElement('div');row.className='file-row';row.innerHTML='<input class="file-url" placeholder="https://files.example.com/data.xlsx"><button type="button" class="file-remove">Remove</button>';row.querySelector('button').onclick=()=>row.remove();box.appendChild(row)}
function newCaseForm(){editingId=null;renderForm({published:1,difficulty_en:'Intermediate',difficulty_ar:'متوسط',tags:[],files:[],sort_order:0})}
function editCase(id){editingId=id;const x=CASES.find(c=>Number(c.id)===Number(id));if(!x)return;renderForm(x)}
function renderForm(x){$('title').textContent=editingId?'Edit Case':'New Case';$('sub').textContent='Build the full analyst case from one place.';content.innerHTML='<div class="panel"><div class="panel-head"><h2>'+ (editingId?'Edit Case':'Create New Case') +'</h2><button class="btn" onclick="overview()">Back to Cases</button></div><form class="form" id="caseForm">'+input('Title EN','title_en',x.title_en||'')+input('Title AR','title_ar',x.title_ar||'')+input('Category EN','category_en',x.category_en||'')+input('Category AR','category_ar',x.category_ar||'')+input('Difficulty EN','difficulty_en',x.difficulty_en||'Intermediate')+input('Difficulty AR','difficulty_ar',x.difficulty_ar||'متوسط')+area('Summary EN','summary_en',x.summary_en||'')+area('Summary AR','summary_ar',x.summary_ar||'')+input('Slug','slug',x.slug||'',true,'revenue-under-pressure')+input('Tags — comma separated','tags',tagsText(x.tags),true,'Revenue, FP&A, Analysis')+'<div class="field"><label>Publication</label><select id="published"><option value="1" '+(x.published?'selected':'')+'>Published</option><option value="0" '+(!x.published?'selected':'')+'>Hidden</option></select></div>'+input('Sort Order','sort_order',x.sort_order??0)+ '<div class="section-label">Case Materials</div>'+area('Business Scenario EN','scenario_en',x.scenario_en||'')+area('Business Scenario AR','scenario_ar',x.scenario_ar||'')+area('Your Mission EN','mission_en',x.mission_en||'')+area('Your Mission AR','mission_ar',x.mission_ar||'')+area('Data Provided EN','data_en',x.data_en||'')+area('Data Provided AR','data_ar',x.data_ar||'')+area('Hints EN','hints_en',x.hints_en||'')+area('Hints AR','hints_ar',x.hints_ar||'')+area('Solution EN','solution_en',x.solution_en||'')+area('Solution AR','solution_ar',x.solution_ar||'')+'<div class="section-label">Files</div><div class="field full"><label>Case Files</label>'+fileRows(x.files)+'</div><div class="savebar"><button type="button" class="btn" onclick="overview()">Cancel</button><button class="btn primary" type="submit">Save Case</button></div></form></div>'; $('caseForm').addEventListener('submit',saveCase)}
async function saveCase(e){e.preventDefault();const ids=['title_en','title_ar','summary_en','summary_ar','category_en','category_ar','difficulty_en','difficulty_ar','scenario_en','scenario_ar','mission_en','mission_ar','data_en','data_ar','hints_en','hints_ar','solution_en','solution_ar'];const body={};ids.forEach(id=>body[id]=$(id).value);body.slug=$('slug').value.trim();body.tags=$('tags').value.split(',').map(s=>s.trim()).filter(Boolean);body.published=$('published').value==='1';body.sort_order=Number($('sort_order').value)||0;body.files=[...document.querySelectorAll('.file-url')].map(i=>i.value.trim()).filter(Boolean);try{if(editingId)await api('/api/cases/'+editingId,{method:'PUT',body:JSON.stringify(body)});else await api('/api/cases',{method:'POST',body:JSON.stringify(body)});toast('Case saved');await overview()}catch(err){alert(err.message)}}
async function toggleCase(id,published){try{const x=CASES.find(c=>Number(c.id)===Number(id));if(!x)return;const body={...x,published,tags:x.tags||[],files:x.files||[]};await api('/api/cases/'+id,{method:'PUT',body:JSON.stringify(body)});toast(published?'Published':'Hidden');await overview()}catch(e){alert(e.message)}}
async function deleteCase(id){const x=CASES.find(c=>Number(c.id)===Number(id));if(!x)return;if(!confirm('Delete “'+x.title_en+'”? This cannot be undone.'))return;try{await api('/api/cases/'+id,{method:'DELETE'});toast('Case deleted');await overview()}catch(e){alert(e.message)}}
$('newCase').addEventListener('click',newCaseForm);
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('theme').addEventListener('click',()=>{dark=!dark;document.documentElement.style.setProperty('--bg',dark?'#121212':'#f3f0e8');document.documentElement.style.setProperty('--panel',dark?'#1d1d1d':'#fffdf8');document.documentElement.style.setProperty('--ink',dark?'#f5f5f5':'#171717');document.documentElement.style.setProperty('--muted',dark?'#aaa':'#77736b');document.documentElement.style.setProperty('--line',dark?'#383838':'#d8d1c4');$('theme').textContent=dark?'Light Mode':'Dark Mode'});
boot();
</script>
</body></html>
